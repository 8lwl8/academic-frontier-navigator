# AFN 主配置
# 依据：架构书 三(二) 定时任务设计、三(四) 知识库设计、六(二) 合规设计要点
# 规范：SPEC-02 §5 YAML 约定、SPEC-06 知识库分库与语料准入
#
# ⚠️ 本文件不得包含任何真实密钥。需要时使用 ${ENV_VAR_NAME} 引用环境变量。

config_version: "1.1"
updated_at: "2026-09-18"

# ============================================================
# 前沿动态每日追踪（架构书 三(二)）
# ============================================================
frontier_radar:
  # 触发策略：按固定周期触发，避免高频触发消耗算力
  schedule:
    enabled: true
    cron: "0 8 * * *"                 # 每日 08:00
    timezone: "Asia/Shanghai"

  # 任务范围：可配置关注的关键词集合、论文来源、时间窗口
  scope:
    keywords:
      - Transformer
      - 注意力机制
      - 序列建模
    sources:
      - arxiv
    lookback_days: 7

  # 产出形态：结构化简报（可被 Web 入口直接消费）+ 对话内推送
  output:
    formats: [json, dialogue]
    data_path: data/briefing
    naming: "briefing-{briefing_date}.json"

  # 幂等性：同一天重复触发不应产生重复简报
  idempotent: true

  # 失败处理：抓取失败时降级为「本次暂无可更新内容」并记录，不阻塞用户其他操作
  on_failure:
    strategy: degrade
    message: 本次暂无可更新内容
    mark_degraded: true
    log_path: logs/radar-failure.log

# ============================================================
# 相关性分层（架构书 四(二)）
# ============================================================
relevance:
  levels: [high, medium, low]
  default_level: medium
  # 高相关内容优先展示
  display_order: [high, medium, low]
  # 相关性判定依据必须具体可核验，不得为空泛描述（SPEC-06 §6.4）
  require_reason: true

# ============================================================
# 知识库（架构书 三(四)；SPEC-06 分库与语料准入）
# ============================================================
knowledge_base:
  # ---- 分库结构（SPEC-06 §三）----
  # 三库不得混放，也不得直接搬运，跨库须重新提炼（SPEC-06 §2.3）
  domains_path: knowledge/domains
  intelligence_path: knowledge/intelligence
  personal_path: knowledge/personal
  index_file: knowledge/domains/_index.md
  graph_file: knowledge/domains/_graph.json

  # ---- 语料准入标准（SPEC-06 §6.1 四维量表，一票否决制）----
  ingestion:
    # A 可访问性：来源可公开访问（架构书三(四)）
    require_source_url: true
    require_public_access: true
    # B 出处明确：有明确作者与出处
    reject_unknown_origin: true
    require_authors: true
    # C 权威性：奠基性或代表性成果
    allowed_levels: [入门, 经典, 前沿]
    reject_unattributed_ai: true        # C5 不可采信：AI 生成未标注一律拒绝
    # D 时效性：按库分别判定（SPEC-06 §6.3）
    domains_max_age_days: null          # domains/ 无硬性年限，靠「三年后是否成立」检验
    intelligence_max_age_days: 7        # 与 frontier_radar.scope.lookback_days 一致
    personal_max_age_days: null
    # 出处核验：source.url 必须由人工逐一访问确认（SPEC-04 §3.3，无例外）
    manual_url_verification: true
    verification_anonymous_only: true   # 只以匿名态为准，避免登录态假可达

  # ---- 知识组织：按「领域 → 子方向 → 知识点 → 文献」层级（架构书 三(四)）----
  # 四层是同一知识单元上的四个坐标，不是四个文件夹（SPEC-06 §四）
  organization:
    hierarchy: [domain, sub_domain, knowledge_point, literature]
    # L1 领域数量上限：聚焦单一细分方向，宁可窄而深（SPEC-06 §4.1）
    max_domains: 2
    # 知识点 id 格式与唯一性约束
    id_pattern: "^kn-\\d{4}$"
    id_reuse_forbidden: true            # id 永不复用，含已下线条目（SPEC-06 §7.3）

  # ---- 依赖关系建模（架构书 三(四)、八章；SPEC-06 §五）----
  # 这是本项目知识库相比普通文档库的核心差异，也是路线生成的依据
  dependency_graph:
    build: true
    # 边方向：前置 → 后继（数据上写在「后继」的 prerequisites 中）
    edge_direction: prerequisite_to_successor
    # 关系类型，对应 schemas/route.schema.json 的 edges[].relation
    relation_types: [prerequisite_of, related_to, extends]
    # related_to 对称，只存一条，方向按 id 升序（SPEC-06 §5.2）
    symmetric_related_dedup: true
    # 强制校验：循环依赖会摧毁路线生成能力，必须拦截
    detect_cycles: true
    reject_dangling_refs: true          # 悬空引用（指向不存在的 id）
    reject_self_loops: true             # 自环
    # prerequisite_of 每条须可辩护，由人工复核（脚本无法判断漏边）
    manual_edge_review: true

  # ---- 复核与退出机制（SPEC-06 §七）----
  # 缺少退出机制的知识库会持续劣化
  lifecycle:
    review_interval_days: 180           # domains/ 每 6 个月复核
    on_url_broken: update_then_retire   # 优先更新链接，无法恢复则下线
    on_outdated: degrade                # 结论被部分修正：保留并标注局限
    retire_on_refuted: true             # 结论被推翻：下线，且 id 不复用
    log_review_result: true             # 复核结论（含「全部通过」）须留痕

  # ---- 检索口径（SPEC-06 §八）----
  retrieval:
    prefer_domains: true                # 概念性问题只检索 domains/
    isolate_personal: true              # personal/ 仅在本人会话中检索
    always_carry_source: true           # 命中必须能带出 source.url
    allow_empty_result: true            # 无命中时返回空，供智能体声明知识边界
    annotate_recency: true              # intelligence/ 命中须显示 published_date

# ============================================================
# 长期记忆（架构书 三(三)）
# ============================================================
memory:
  # 记忆写入原则：只沉淀有长期价值的结构化信息，不记录原始对话流水
  store_raw_dialogue: false
  layers:
    - user_profile      # 用户画像：决定输出的深度与假设前提
    - progress          # 进度记忆：支撑路线动态调整
    - preference        # 偏好记忆：提升个性化程度
    - project_trajectory # 项目轨迹：支撑跨会话的连贯指导

# ============================================================
# 合规（架构书 六(二)）
# ============================================================
compliance:
  # 知识边界声明：超出知识范围时必须显式声明，不得推测性作答
  knowledge_boundary_declaration: true
  # 出处标注：所有学术内容附来源，便于用户核验
  require_citation: true
  # 可见度控制：个人资产遵循平台权限体系，默认私密
  default_visibility: private
  visibility_levels: [private, campus, public]
  # 知识产权：第三方库与开源资源在文档中注明
  third_party_manifest: docs/第三方资源清单.md
  # AI 使用边界：严格遵守手册 8.3，保留完整迭代记录以备评审
  ai_iteration_log_required: true
  ai_iteration_log_path: iteration-log

# ============================================================
# Web 展示层（架构书 四(二)、五(二)）
# ============================================================
web:
  # 只读展示加跳转入口的极简定位，不实现独立的智能体逻辑
  readonly: true
  # 数据来自智能体输出结果的落地存储，不做实时双向同步
  data_path: data
  data_sync: static
  # 页面
  pages:
    - id: home
      name: 首页
      data_source: static
    - id: route
      name: 学习路线
      data_source: data/route
    - id: briefing
      name: 前沿简报
      data_source: data/briefing
    - id: assets
      name: 知识资产
      data_source: data/assets

# ============================================================
# 数据格式（架构书 五(一)）
# ============================================================
formats:
  knowledge_unit: markdown     # Markdown 承载知识单元
  structured_output: json      # JSON 承载结构化输出
  configuration: yaml          # YAML 承载配置
  encoding: utf-8
  line_ending: lf

# ============================================================
# 校验入口（SPEC-06 §六）
# ============================================================
validation:
  # 知识单元结构、字段、依赖图（无环 / 无悬空 / 无自环）
  knowledge_units:
    script: scripts/check_knowledge_units.py
    url_check_flag: --url-check
  # data/ 下 JSON 是否符合 schemas/ 契约
  data_schemas:
    script: scripts/validate_schemas.py
