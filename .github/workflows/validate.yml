# 轻量校验工作流
# 依据：SPEC-03 §7 CI 边界 —— 只校验，不构建
#
# ⚠️ 架构书 五(三) 明确排除「生产级监控、CI/CD 流水线」。
#    本工作流仅做格式与合规的低级错误拦截，不做构建与部署。
#    判据：这条 CI 是在帮我们避免低级错误，还是在替我们做部署？前者留，后者删。

name: 轻量校验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: 格式与合规校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装校验依赖
        run: pip install jsonschema pyyaml

      # ---- 1. JSON Schema 校验 ----
      - name: 校验 JSON 数据契约
        run: python scripts/validate_schemas.py

      # ---- 2. YAML 语法校验 ----
      - name: 校验 YAML 语法
        run: |
          python - <<'PY'
          import sys, pathlib, yaml
          bad = []
          for p in pathlib.Path('.').rglob('*.y*ml'):
              if '.git' in p.parts:
                  continue
              try:
                  list(yaml.safe_load_all(p.read_text(encoding='utf-8')))
              except Exception as e:
                  bad.append(f'{p}: {e}')
          if bad:
              print('YAML 语法错误：')
              print('\n'.join(bad))
              sys.exit(1)
          print('YAML 语法校验通过')
          PY

      # ---- 3. 密钥扫描 ----
      - name: 扫描配置中的疑似密钥
        run: python scripts/scan_secrets.py

      # ---- 4. 敏感数据拦截 ----
      - name: 拦截真实个人数据
        run: python scripts/block_private_data.py

      # ---- 5. 提交信息格式校验 ----
      - name: 校验提交信息格式
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import subprocess, re, sys
          base = "${{ github.event.pull_request.base.sha }}"
          head = "${{ github.event.pull_request.head.sha }}"
          msgs = subprocess.run(
              ['git', 'log', '--format=%s', f'{base}..{head}'],
              capture_output=True, text=True).stdout.strip().split('\n')
          pat = re.compile(
              r'^(feat|fix|docs|data|prompt|refactor|chore|revert)'
              r'(\([a-z]+\))?: .+')
          bad = [m for m in msgs if m and not pat.match(m)]
          if bad:
              print('以下提交信息不符合规范（SPEC-03 §4）：')
              print('\n'.join(f'  ✗ {m}' for m in bad))
              sys.exit(1)
          print(f'提交信息校验通过（{len(msgs)} 条）')
          PY

      # ---- 6. 仓库卫生检查 ----
      - name: 检查文件命名与敏感文件
        run: |
          python - <<'PY'
          import subprocess, sys
          files = subprocess.run(['git','ls-files'], capture_output=True,
                                 text=True).stdout.split('\n')
          bad_names = [f for f in files
                       if any(k in f for k in ('副本', '最终版', '最终最终', 'copy of'))]
          sensitive = [f for f in files
                       if f.endswith('.private.md') or f.endswith('.private.json')
                       or f == '.env']
          fail = False
          if bad_names:
              print('检测到不规范的文件命名：')
              print('\n'.join(f'  ✗ {f}' for f in bad_names))
              fail = True
          if sensitive:
              print('检测到不应入库的敏感文件：')
              print('\n'.join(f'  ✗ {f}' for f in sensitive))
              fail = True
          if fail:
              sys.exit(1)
          print(f'仓库卫生检查通过（{len(files)} 个文件）')
          PY
